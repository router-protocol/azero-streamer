replicaCount: 1

app: azero-streamer
env: mainnet
gitRepo: https://github.com/router-protocol/azero-streamer

image:
  repository: asia-south1-docker.pkg.dev/router-mainnet-api/router-apps-asia-south/azero-streamer
  tag: latest
  pullPolicy: IfNotPresent

container:
  secretName: azero-streamer-env

service:
  type: NodePort
  name: azero-streamer
  port: 8903
  targetPort: 8903

sslcert:
  enabled: true
  name: "azero-streamer-tls"
  host: "api.azero-streamer.routerchain.network"
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "20"
    "helm.sh/resource-policy": "keep"

autoscaling:
  enabled: true
  targetCPUUtilizationPercentage: 85
  minReplicas: 1
  maxReplicas: 1

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/v1: "managed-certificates"
    "helm.sh/resource-policy": "keep"

backendConfig:
  healthCheck:
    requestPath: /
    checkIntervalSec: 60
    timeoutSec: 100
    healthyThreshold: 1
    unhealthyThreshold: 5

resources:
  requests:
    memory: "2Gi"
    cpu: "200m"
  limits:
    memory: "3Gi"
    cpu: "1000m"
